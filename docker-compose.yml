services:
  postgres:
    image: postgres:16-alpine
    container_name: votoreal_postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=TECNOlogia2026.$
      - POSTGRES_DB=conteo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d conteo || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: votoreal_backend
    environment:
      - PORT=5180
      - DB_USER=postgres
      - DB_PASSWORD=TECNOlogia2026.$
      - DB_SERVER=postgres
      - DB_PORT=5432
      - DB_NAME=conteo
    ports:
      - "5180:5180"
    depends_on:
      postgres:
        condition: service_healthy
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: votoreal_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
