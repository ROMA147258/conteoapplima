<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card with Smooth Rounded Corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" stroke="url(#iconGrad)" stroke-width="12"/>

  <!-- Glowing Aura Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#iconGrad)" stroke-width="8" opacity="0.4" filter="url(#glow)"/>

  <!-- Main Ballot Box Icon Group -->
  <g transform="translate(106, 106) scale(1.25)">
    <!-- Ballot Box -->
    <path d="M 40 100 L 200 100 L 210 210 Q 210 220 200 220 L 40 220 Q 30 220 30 210 L 40 100 Z" fill="none" stroke="url(#iconGrad)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Top Slot Cover -->
    <rect x="20" y="80" width="200" height="24" rx="8" fill="url(#iconGrad)"/>
    
    <!-- Slot Opening -->
    <rect x="70" y="88" width="100" height="8" rx="4" fill="#0f172a"/>

    <!-- Voting Paper / Checkmark Document -->
    <g transform="translate(50, 10) rotate(-6, 70, 60)">
      <rect x="25" y="10" width="90" height="100" rx="12" fill="#ffffff" stroke="url(#iconGrad)" stroke-width="6"/>
      <!-- Lines on Ballot -->
      <line x1="45" y1="35" x2="95" y2="35" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      <line x1="45" y1="55" x2="85" y2="55" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
      <!-- Checkmark -->
      <path d="M 45 80 L 60 95 L 95 60" fill="none" stroke="url(#checkGrad)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
